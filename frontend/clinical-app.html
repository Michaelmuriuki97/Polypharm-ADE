<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1228" />
    <title>Polypharm ADE · Clinical App</title>

    <style>
      .back-home {
        position: fixed;
        top: 16px;
        right: 20px;
        z-index: 1000;
        padding: 10px 16px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 12px;
        background: #17213b;
        color: #fff;
        font: 600 14px/1.2 system-ui, sans-serif;
        text-decoration: none;
      }

      .back-home:hover {
        background: #253657;
      }

      .loading-screen {
        position: relative;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 15% 10%, #26345f, transparent 40%), #0d1228;
      }

      .loading-brand-icon {
        position: fixed;
        top: 18px;
        left: 20px;
        width: 38px;
        height: 38px;
        object-fit: cover;
        border: 1px solid #ffffff30;
        border-radius: 12px;
        box-shadow: 0 8px 22px #0004;
      }

      .loading-spinner {
        width: 54px;
        height: 54px;
        border: 4px solid #ffffff24;
        border-top-color: #65dfd3;
        border-right-color: #89c5f4;
        border-radius: 50%;
        animation: clinical-loading-spin .78s linear infinite;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes clinical-loading-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .loading-spinner { animation-duration: 2s; }
      }

      @media (max-width: 600px) {
        .back-home {
          top: 10px;
          right: 10px;
          padding: 8px 12px;
          font-size: 13px;
        }
      }
    </style>
  </head>

  <body>
    <a class="back-home" href="%BASE_URL%./index.html">← Back</a>

    <div id="root">
      <main class="loading-screen" role="status" aria-label="Loading sign-in">
        <img class="loading-brand-icon" src="%BASE_URL%images/logo.png" alt="Polypharm ADE" />
        <span class="loading-spinner" aria-hidden="true"></span>
        <span class="visually-hidden">Loading sign-in…</span>
      </main>
    </div>

    <script type="module" src="%BASE_URL%./src/main.jsx"></script>
  </body>
</html>
